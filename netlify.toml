# Static site: landing at /, room planner at /roomplanner/
[build]
  publish = "."
  # The Netlify UI has build.command set to the literal string
  # "# no build command". On Linux that is a shell comment and does
  # nothing; a CLI deploy from Windows runs it through cmd.exe, which has
  # no comment syntax, so the build fails with
  #   "'#' is not recognized as an internal or external command".
  #
  # netlify.toml takes precedence over the UI setting, so declaring a
  # genuine no-op here fixes it on every platform. echo exists in both
  # cmd.exe and sh. The site is static -- there is nothing to build.
  command = "echo no build step required"

# ---------------------------------------------------------------------
# Keeping the source out of the public site is handled by _redirects,
# which is GENERATED by _build_redirects.py.
#
# It is not done here because Netlify redirect splats must be TRAILING:
# a pattern like "/*.md" parses fine and then silently never matches.
# That was verified against production -- with those rules deployed,
# BILT_STUDIO_HANDOFF.md, SEO.md and every generator script still
# returned 200, while explicit rules returned 404 correctly.
#
# So the block list has to be one line per file, and generating it from
# the directory is the only version that does not go stale the moment
# someone adds a file. Re-run _build_redirects.py before deploying.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------

# Trailing-slash tidy-up so /roomplanner resolves
[[redirects]]
  from = "/roomplanner"
  to = "/roomplanner/"
  status = 301

[[redirects]]
  from = "/planner"
  to = "/roomplanner/"
  status = 301

# Short paths people guess, pointed at the pages that answer them.
[[redirects]]
  from = "/kitchens"
  to = "/kitchens/queensland/"
  status = 301

[[redirects]]
  from = "/queensland"
  to = "/kitchens/queensland/"
  status = 301

[[redirects]]
  from = "/granny-flat"
  to = "/kitchens/granny-flat/"
  status = 301

[[redirects]]
  from = "/tiny-home"
  to = "/kitchens/tiny-home/"
  status = 301
