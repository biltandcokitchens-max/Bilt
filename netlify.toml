# Bilt & Co — static site, no build step.
#
# The Netlify UI on this site has build.command set to the literal string
# "# no build command". On Linux that is a shell comment and does nothing, but
# a deploy that runs it through cmd.exe fails with
#   "'#' is not recognized as an internal or external command".
# netlify.toml takes precedence over the UI setting, so a genuine no-op is
# declared here instead. `echo` exists in both cmd.exe and sh.
#
# The site is generated by `node _build.js` and the output is committed, so
# there is genuinely nothing for Netlify to build.

[build]
  publish = "."
  command = "echo no build step required"

# Source and documentation must not be served from the public site. Netlify
# applies these before the static file lookup.
[[redirects]]
  from = "/_build.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_pages.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_redirects-from-old-site.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PLACEHOLDERS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SEO-STRATEGY.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/IMAGE-CREDITS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/out-redirects/*"
  to = "/404.html"
  status = 404
  force = true

# Long cache on fingerprint-free static assets is unsafe, so keep it short
# enough that a redeploy is picked up, long enough to help repeat visits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
