<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilt Studio — Cut-to-size cabinetry, priced live</title>
<meta name="description" content="Configure any cabinet, see the price change as you type, and get the cut list before you pay.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%238A5E3A'/><path d='M9 8v16M9 16l9-8M9 16l10 8' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/" title="Back to biltstudio.com.au"><b>BILT</b><span>Cut&nbsp;to&nbsp;size</span></a>
    <nav class="nav" id="nav">
      <a href="#/shop">Shop</a>
      <a href="#/plan">Room planner</a>
      <a href="#/job">Your job</a>
      <a href="#/how">How it works</a>
    </nav>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Pricing mode">
        <button data-act="mode" data-mode="trade" type="button">Trade</button>
        <button data-act="mode" data-mode="retail" type="button">Homeowner</button>
      </div>
      <button class="icon-btn" data-act="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="cart-btn" data-act="opencart" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        <span>Job</span><span class="pill" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<div class="notice">
  <div class="notice-in" id="notice"></div>
</div>

<main class="wrap" id="view" tabindex="-1"></main>

<div class="scrim" id="scrim" data-act="closecart"></div>
<aside class="drawer" id="drawer" aria-label="Job summary" aria-hidden="true">
  <header>
    <h2>Your job</h2>
    <button class="icon-btn" data-act="closecart" type="button" aria-label="Close" style="margin-left:auto;border-color:var(--line-2);background:var(--surface-2);color:var(--ink)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="body" id="drawerBody"></div>
  <footer id="drawerFoot"></footer>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- three.js r160, MIT, vendored in vendor/. It used to load from unpkg
     and failed roughly half the time, taking the planner's 3D with it.
     Still only fetched when the planner opens, so the shop stays light. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
